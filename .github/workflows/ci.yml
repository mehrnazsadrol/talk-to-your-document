name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python deps
        run: pip install -r requirements.lock.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Lint (ruff format)
        run: ruff format --check .

      - name: Run tests
        env:
          MLFLOW_ENABLED: "false"
          DEEPSEEK_API_KEY: "ci-test-not-real"
        run: pytest -q -m "not slow"

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          tags: ttyd-api:test
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test API image
        run: |
          docker run -d --name api -p 8000:8000 -e DEEPSEEK_API_KEY=ci ttyd-api:test
          sleep 10
          curl -fsS localhost:8000/health
          docker stop api

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          tags: ttyd-frontend:test
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
